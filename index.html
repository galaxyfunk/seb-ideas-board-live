<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Seb · Cloud Employee ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:ital,wght@1,400;1,600&display=swap" rel="stylesheet"/>
</head>
<body>
<header>
  <div class="wrap">
    <div class="header-top">
      <div class="brand">
        <a class="brand-logo" href="https://www.cloudemployee.io" target="_blank" rel="noopener noreferrer" aria-label="Cloud Employee">
          <img src="https://www.cloudemployee.io/ce-logo.svg" alt="Cloud Employee"/>
        </a>
        <h1 class="brand-seb">Seb</h1>
      </div>
      <div class="header-actions">
        <p class="count" id="filter-count">67 ideas</p>
        <button type="button" class="picks-chip" id="picks-chip" title="Hook picks (local)">Picks 0</button>
      </div>
    </div>
    <div class="filters-bar">
      <button type="button" class="filters-toggle" id="filters-toggle" aria-expanded="false" aria-controls="filters">
        Filters<span class="filters-badge" id="filters-badge" hidden>0</span>
      </button>
    </div>
    <div class="filters" id="filters" hidden>
      <div class="filter-row" id="hook-type-filters">
        <span class="filter-label">Hook</span>
      </div>
      <div class="filter-row" id="theme-filters">
        <span class="filter-label">Theme</span>
      </div>
      <div class="filter-row" id="score-filters">
        <span class="filter-label">Score</span>
      </div>
      <div class="filter-row">
        <span class="filter-label">Search</span>
        <div class="search-wrap">
          <input type="search" id="search" placeholder="Title, jist, hook, tags…" autocomplete="off"/>
        </div>
        <div class="filter-actions">
          <button type="button" class="btn-ghost" id="clear-filters">Clear filters</button>
        </div>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="masonry" id="grid"></div>
  <div class="empty" id="empty" hidden>No ideas match these filters.</div>
</main>

<footer>
  Enriched from Fireflies Jul–Sep 2026 · Hook variants from HOOK_BANK · No invented CE stats
</footer>

<div class="overlay" id="overlay" aria-hidden="true"></div>
<aside class="sidebar" id="sidebar" aria-hidden="true" role="dialog" aria-labelledby="sb-title">
  <div class="sidebar-header">
    <h2 id="sb-title"></h2>
    <button type="button" class="close-btn" id="close-sidebar" aria-label="Close">×</button>
  </div>
  <div class="sidebar-body" id="sb-body"></div>
</aside>
<div class="toast" id="toast">Copied</div>

<div class="picks-panel" id="picks-panel" aria-hidden="true">
  <div class="picks-panel-header">
    <h3>Hook picks</h3>
    <button type="button" class="btn-ghost" id="close-picks" aria-label="Close picks">Close</button>
  </div>
  <div class="picks-panel-body" id="picks-list"></div>
  <div class="picks-panel-footer">
    <button type="button" id="download-picks">Download JSON</button>
    <button type="button" class="danger" id="clear-picks">Clear picks</button>
  </div>
</div>
<script src="board-loader.js"></script>
</body>
</html>
